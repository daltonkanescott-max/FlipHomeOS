name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack FlipHome OS source
        run: |
          rm -rf project
          mkdir project
          unzip -q FlipHomeOS-GitHub-Free-Build.zip -d project

      - name: Apply v0.4.1 launcher + reliable cover wake
        run: |
          rm -rf /tmp/fliphome-v040
          mkdir -p /tmp/fliphome-v040
          tar -xzf ci-patches-v040.tar.gz -C /tmp/fliphome-v040

          cp ci-patches-v041/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          cp /tmp/fliphome-v040/build.gradle project/app/build.gradle

          mkdir -p project/app/src/main/java/com/fliphomeos/app/model
          mkdir -p project/app/src/main/java/com/fliphomeos/app/data
          mkdir -p project/app/src/main/java/com/fliphomeos/app/ui
          mkdir -p project/app/src/main/java/com/fliphomeos/app/service

          cp /tmp/fliphome-v040/java/model/*.kt project/app/src/main/java/com/fliphomeos/app/model/
          cp /tmp/fliphome-v040/java/data/*.kt project/app/src/main/java/com/fliphomeos/app/data/
          cp /tmp/fliphome-v040/java/ui/*.kt project/app/src/main/java/com/fliphomeos/app/ui/

          cp ci-patches-v041/CoverTakeoverAccessibilityService.kt project/app/src/main/java/com/fliphomeos/app/service/CoverTakeoverAccessibilityService.kt
          cp ci-patches-v021/CoverDisplayLauncher.kt project/app/src/main/java/com/fliphomeos/app/service/CoverDisplayLauncher.kt
          cp ci-patches-v021/TakeoverSetup.kt project/app/src/main/java/com/fliphomeos/app/service/TakeoverSetup.kt

          cp /tmp/fliphome-v040/res/layout/*.xml project/app/src/main/res/layout/
          cp /tmp/fliphome-v040/res/values/*.xml project/app/src/main/res/values/
          cp /tmp/fliphome-v040/res/drawable/*.xml project/app/src/main/res/drawable/

          cp ci-patches-v020/cover_takeover_accessibility_service.xml project/app/src/main/res/xml/cover_takeover_accessibility_service.xml
          cp ci-patches/samsung_cover_widget_info.xml project/app/src/main/res/xml/samsung_cover_widget_info.xml
          cp ci-patches/CoverWidgetProvider.kt project/app/src/main/java/com/fliphomeos/app/widget/CoverWidgetProvider.kt

          echo "FlipHome v0.4.1 patch applied"
          grep -n "versionName" project/app/build.gradle
          grep -n "ViewPager2" project/app/src/main/java/com/fliphomeos/app/ui/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep a stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fliphomeos-debug-keystore-v1

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --stacktrace --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipHomeOS-debug-v0.4.1-experimental
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
