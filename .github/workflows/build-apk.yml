name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack FlipHome OS source
        run: |
          rm -rf project
          mkdir project
          unzip -q FlipHomeOS-GitHub-Free-Build.zip -d project
          echo "Project contents:"
          ls -la project

      - name: Apply v0.2.1 cover takeover and secondary-display launch fixes
        run: |
          cp ci-patches-v021/AndroidManifest.xml project/app/src/main/AndroidManifest.xml

          mkdir -p project/app/src/main/java/com/fliphomeos/app/service
          cp ci-patches-v020/CoverTakeoverAccessibilityService.kt project/app/src/main/java/com/fliphomeos/app/service/CoverTakeoverAccessibilityService.kt
          cp ci-patches-v021/CoverDisplayLauncher.kt project/app/src/main/java/com/fliphomeos/app/service/CoverDisplayLauncher.kt
          cp ci-patches-v021/TakeoverSetup.kt project/app/src/main/java/com/fliphomeos/app/service/TakeoverSetup.kt

          cp ci-patches-v020/cover_takeover_accessibility_service.xml project/app/src/main/res/xml/cover_takeover_accessibility_service.xml
          cp ci-patches-v020/strings.xml project/app/src/main/res/values/strings.xml
          cp ci-patches/samsung_cover_widget_info.xml project/app/src/main/res/xml/samsung_cover_widget_info.xml
          cp ci-patches/CoverWidgetProvider.kt project/app/src/main/java/com/fliphomeos/app/widget/CoverWidgetProvider.kt

          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/src/main/java/com/fliphomeos/app/ui/MainActivity.kt")
          s = p.read_text()

          old = """            intent.addFlags(Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
            startActivity(intent)"""
          new = """            com.fliphomeos.app.service.CoverDisplayLauncher.launch(this, intent)"""
          if old not in s:
              raise SystemExit("Could not find old app-launch block in MainActivity.kt")
          s = s.replace(old, new, 1)

          setup_needle = """        updateClock()
        applyWallpaper()
        loadHomeApps()
    }"""
          setup_replacement = """        updateClock()
        applyWallpaper()
        loadHomeApps()
        handler.postDelayed({
            com.fliphomeos.app.service.TakeoverSetup.promptIfNeeded(this)
        }, 500L)
    }"""
          if setup_needle not in s:
              raise SystemExit("Could not find setup insertion point in MainActivity.kt")
          s = s.replace(setup_needle, setup_replacement, 1)

          p.write_text(s)
          PY

          sed -i "s/versionCode 1/versionCode 4/" project/app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.2.1-experimental'/" project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep a stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fliphomeos-debug-keystore-v1

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --stacktrace --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipHomeOS-debug-v0.2.1-experimental
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
