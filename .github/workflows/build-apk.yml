name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack FlipHome OS source
        run: |
          rm -rf project
          mkdir project
          unzip -q FlipHomeOS-GitHub-Free-Build.zip -d project
          echo "Project contents:"
          ls -la project

      - name: Apply v0.3.1 unlock-safe cover navigation
        run: |
          cp ci-patches-v031/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          mkdir -p project/app/src/main/java/com/fliphomeos/app/service
          cp ci-patches-v031/CoverTakeoverAccessibilityService.kt project/app/src/main/java/com/fliphomeos/app/service/CoverTakeoverAccessibilityService.kt
          cp ci-patches-v021/CoverDisplayLauncher.kt project/app/src/main/java/com/fliphomeos/app/service/CoverDisplayLauncher.kt
          cp ci-patches-v021/TakeoverSetup.kt project/app/src/main/java/com/fliphomeos/app/service/TakeoverSetup.kt
          cp ci-patches-v020/cover_takeover_accessibility_service.xml project/app/src/main/res/xml/cover_takeover_accessibility_service.xml
          cp ci-patches-v020/strings.xml project/app/src/main/res/values/strings.xml
          cp ci-patches/samsung_cover_widget_info.xml project/app/src/main/res/xml/samsung_cover_widget_info.xml
          cp ci-patches/CoverWidgetProvider.kt project/app/src/main/java/com/fliphomeos/app/widget/CoverWidgetProvider.kt
          python3 -c 'from pathlib import Path; p=Path("project/app/src/main/java/com/fliphomeos/app/ui/MainActivity.kt"); s=p.read_text(); old="            intent.addFlags(Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)\n            startActivity(intent)"; new="            com.fliphomeos.app.service.CoverDisplayLauncher.launch(this, intent)"; assert old in s, "old app launch block not found"; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("project/app/src/main/java/com/fliphomeos/app/ui/MainActivity.kt"); s=p.read_text(); old="        updateClock()\n        applyWallpaper()\n        loadHomeApps()\n    }"; new="        updateClock()\n        applyWallpaper()\n        loadHomeApps()\n        handler.postDelayed({\n            com.fliphomeos.app.service.TakeoverSetup.promptIfNeeded(this)\n        }, 500L)\n    }"; assert old in s, "setup insertion point not found"; p.write_text(s.replace(old,new,1))'
          sed -i "s/versionCode 1/versionCode 6/" project/app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.3.1-experimental'/" project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep a stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fliphomeos-debug-keystore-v1

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --stacktrace --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipHomeOS-debug-v0.3.1-experimental
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
